name: CI

# Everything this repo builds against is on npm now - lnurlcash-kit,
# lnurlcash-conformance, keystore-kit and @forgesworn/moneyer, the last of
# which the integration tests run a real mint from. CI used to check each one
# out by name and build it in dependency order, from when they were file:
# siblings; that shape outlived the reason for it and was quietly resolving
# repositories through a GitHub redirect after the org move.

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
