<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1013" />
    <!-- Bearer-note traffic is GETs with the k1 in the URL; nothing but
         our own bundle may run, and only mint/NWC endpoints may be
         contacted (loopback http for dev mints). frame-ancestors only
         takes effect when also sent as an HTTP header. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:*; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>notecase</title>
    <meta name="description" content="A case for Lightning bearer notes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='6' width='20' height='14' rx='3' fill='%23c9ced8'/%3E%3Crect x='14' y='11' width='6' height='4' rx='2' fill='%230f1013'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <div id="toasts"></div>
  </body>
</html>
